<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ==== SEO / META (edita con tu información) ============================ -->
    <title>Simón Colonia · Full Stack & Mobile Developer</title>
    <meta
      name="description"
      content="Portafolio de Simón Colonia, Ingeniero Informático enfocado en desarrollo web full-stack (React, TypeScript, Supabase) y móvil (Kotlin). Proyectos, habilidades y contacto."
    />
    <meta name="author" content="Simón Colonia" />

    <!-- ==== Fuente Inter (opcional) ======================================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- ==== Anti-parpadeo: aplica el tema guardado ANTES de pintar ========= -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch (e) {
          /* localStorage no disponible: se queda en modo oscuro por defecto */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
