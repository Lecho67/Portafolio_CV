<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <!-- ==== SEO / META (edita con tu información) ============================ -->
    <title>Simón Colonia · Full Stack & Mobile Developer</title>
    <meta
      name="description"
      content="Portafolio de Simón Colonia, Ingeniero Informático enfocado en desarrollo web full-stack (React, TypeScript, Supabase) y móvil (Kotlin). Proyectos, habilidades y contacto."
    />
    <meta name="author" content="Simón Colonia" />
    <!-- TODO: reemplaza https://tu-dominio.com por la URL real donde despliegues
         el sitio (Vercel, GitHub Pages, dominio propio…) en las 3 etiquetas
         siguientes: canonical, og:url y (si la añades) og:image. -->
    <link rel="canonical" href="https://tu-dominio.com/" />

    <!-- ==== Open Graph / Twitter (previsualización al compartir el enlace) === -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_CO" />
    <meta property="og:site_name" content="Simón Colonia" />
    <meta property="og:title" content="Simón Colonia · Full Stack & Mobile Developer" />
    <meta
      property="og:description"
      content="Ingeniero Informático · Construyo plataformas web full-stack con React/TypeScript/Supabase y apps Android nativas en Kotlin."
    />
    <meta property="og:url" content="https://tu-dominio.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Simón Colonia · Full Stack & Mobile Developer" />
    <meta
      name="twitter:description"
      content="Ingeniero Informático · Construyo plataformas web full-stack con React/TypeScript/Supabase y apps Android nativas en Kotlin."
    />
    <!-- TODO: añade una imagen /public/og.png (1200×630) y descomenta estas líneas
    <meta property="og:image" content="https://tu-dominio.com/og.png" />
    <meta name="twitter:image" content="https://tu-dominio.com/og.png" />
    -->

    <!-- ==== Fuentes: Inter (cuerpo) + Space Grotesk (títulos) ============== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- ==== Anti-parpadeo: aplica el tema guardado ANTES de pintar ========= -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          document.documentElement.classList.toggle('dark', theme === 'dark');
        } catch (e) {
          /* localStorage no disponible: se queda en modo oscuro por defecto */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
